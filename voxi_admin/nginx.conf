server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the tee-api service
    location ~ ^/(misses|chat|stats|save|qa|namespaces|products|suggest|extract|chunk) {
        proxy_pass         http://tee-api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
